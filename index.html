<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">
  <meta id="theme-color" name="theme-color" content="#131823">
  <title>Team Room</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131823'/%3E%3Crect x='6' y='6' width='9' height='9' rx='3' fill='%2393C5FD'/%3E%3Crect x='17' y='6' width='9' height='9' rx='3' fill='%23F0ABFC'/%3E%3Crect x='6' y='17' width='9' height='9' rx='3' fill='%23FDE68A'/%3E%3Crect x='17' y='17' width='9' height='9' rx='3' fill='%23A7F3D0'/%3E%3C/svg%3E">

  <!-- Aplica el tema guardado antes de pintar, para evitar un destello -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('sala:v1:theme') === 'light') document.documentElement.classList.add('light-theme');
      } catch (e) { /* sin acceso a localStorage */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Acceso -->
  <main id="login" class="login">
    <form id="login-form" class="login-card" autocomplete="on">
      <span class="brand-mark" aria-hidden="true">
        <i data-accent="blue"></i><i data-accent="magenta"></i><i data-accent="yellow"></i><i data-accent="green"></i>
      </span>
      <h1 id="login-title">Team Room</h1>
      <p class="login-sub">Introduce la contraseña del equipo para entrar.</p>

      <label class="field-label" for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required autofocus>

      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button id="login-submit" class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </main>

  <!-- Aplicación -->
  <div id="app" class="app" hidden>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <i data-accent="blue"></i><i data-accent="magenta"></i><i data-accent="yellow"></i><i data-accent="green"></i>
        </span>
        <p id="brand-name" class="brand-name">Team Room</p>
      </div>

      <div class="topbar-actions">
        <div class="select-wrap">
          <svg class="select-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h3a2 2 0 0 1 2 2v14M2 20h3M13 20h9M10 12v.01M13 4.56v16.16a1 1 0 0 1-1.24.97L5 20V5.56a2 2 0 0 1 1.52-1.94l4-1A2 2 0 0 1 13 4.56Z"/></svg>
          <select id="template-select" aria-label="Habitación actual" title="Habitación actual"></select>
          <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <button id="theme-btn" class="btn btn-ghost" type="button" title="Cambiar a modo claro">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
          <span id="theme-label" class="btn-label">Modo claro</span>
        </button>
        <button id="export-btn" class="btn btn-ghost" type="button" title="Exportar todas las conversaciones en Markdown">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
          <span class="btn-label">Exportar</span>
        </button>
        <button id="clear-all-btn" class="btn btn-ghost" type="button" title="Limpiar el historial de todos los agentes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span class="btn-label">Limpiar historial</span>
        </button>
        <button id="logout-btn" class="btn btn-ghost" type="button" title="Cerrar sesión">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H10"/></svg>
          <span class="btn-label">Cerrar sesión</span>
        </button>
      </div>
    </header>

    <!-- Selector de agente: solo se ve en pantallas estrechas -->
    <nav id="tabs" class="tabs" aria-label="Agentes de la sala"></nav>

    <main class="board">
      <section id="columns" class="columns" aria-label="Conversaciones con los agentes"></section>
    </main>

    <form id="composer" class="composer" autocomplete="off">
      <div id="attachment" class="attachment" hidden>
        <img id="attachment-thumb" class="attachment-thumb" alt="Vista previa de la imagen adjunta" hidden>
        <div class="attachment-info">
          <p id="attachment-name" class="attachment-name"></p>
          <p id="attachment-meta" class="attachment-meta"></p>
        </div>
        <button id="attachment-remove" class="icon-btn" type="button" aria-label="Quitar la imagen" title="Quitar la imagen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p id="attach-error" class="form-error attach-error" role="alert" hidden></p>

      <div class="composer-box">
        <input id="file-input" type="file" accept="image/*" hidden>
        <button id="attach-btn" class="icon-btn attach-btn" type="button" aria-label="Adjuntar una imagen" title="Adjuntar una imagen (también puedes pegarla o arrastrarla)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <label class="sr-only" for="input">Mensaje para todos los agentes</label>
        <textarea id="input" rows="1" placeholder="Escribe un mensaje para todo el equipo" spellcheck="true"></textarea>
        <button id="send-btn" class="send-btn" type="submit" aria-label="Enviar a todos los agentes" disabled>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <p id="hint" class="hint" role="status"></p>
    </form>
  </div>

  <!-- Aviso al arrastrar una imagen -->
  <div id="drop-hint" class="drop-hint" hidden>
    <div class="drop-hint-card">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
      <p>Suelta la imagen para que la vean los agentes</p>
    </div>
  </div>

  <!-- Confirmación -->
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-ghost" value="cancel">Cancelar</button>
        <button id="dialog-ok" class="btn btn-danger" value="ok"></button>
      </div>
    </form>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
